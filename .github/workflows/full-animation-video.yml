name: Comprehensive whiteboard animation test

on:
  workflow_dispatch:
  push:
    branches: [codex/full-animation-test]

permissions:
  contents: read

jobs:
  render-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python test and fixture dependencies
        timeout-minutes: 4
        run: python -m pip install --timeout 15 --retries 2 -r requirements.txt
      - name: Install FFmpeg and select runner Chrome
        timeout-minutes: 4
        run: |
          if ! command -v ffmpeg || ! command -v ffprobe || [ ! -x /usr/bin/time ]; then
            apt_options=(-o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15)
            if ! sudo apt-get "${apt_options[@]}" install --no-install-recommends -y ffmpeg time; then
              sudo apt-get "${apt_options[@]}" update
              sudo apt-get "${apt_options[@]}" install --no-install-recommends -y ffmpeg time
            fi
          fi
          browser=$(command -v google-chrome || command -v chromium)
          printf 'CHROME_PATH=%s\nARTIFACT_DIR=%s\n' "$browser" "$RUNNER_TEMP/full-animation" >> "$GITHUB_ENV"
      - name: Build demo and durability fixtures
        run: python scripts/build-animation-demo.py --endurance
      - name: Run existing Python tests
        run: python -m pytest -q
      - name: Check TypeScript and replay previous hand-motion regression
        working-directory: studio
        run: |
          npm ci
          npm run typecheck
          node scripts/verify-hand-motion.cjs "$RUNNER_TEMP/hand-motion-regression"
      - name: Verify contact, transitions and effects in Chromium
        working-directory: studio
        run: node scripts/verify-animation-demo.cjs "$ARTIFACT_DIR"
      - name: Render the comprehensive video
        working-directory: studio
        run: |
          npm run render -- C "$ARTIFACT_DIR/animation-test.mp4" \
            --props='{"videoId":"full-animation-demo","timelineFile":"timeline.json"}' \
            --browser-executable="$CHROME_PATH" --concurrency=2 --timeout=120000
      - name: Render an 18-minute durability proxy
        working-directory: studio
        run: |
          /usr/bin/time -f '%e %M' -o "$RUNNER_TEMP/endurance-metrics.txt" \
            npm run render -- C "$RUNNER_TEMP/endurance.mp4" \
            --props='{"videoId":"full-animation-demo","timelineFile":"endurance.json"}' \
            --browser-executable="$CHROME_PATH" --concurrency=2 --timeout=120000 --scale=0.3333333333333333
      - name: Verify decoded media and generate reports
        run: |
          python scripts/verify-animation-media.py "$ARTIFACT_DIR" "$RUNNER_TEMP/endurance.mp4" "$RUNNER_TEMP/endurance-metrics.txt"
          cp docs/animation-test-status.md "$ARTIFACT_DIR/feature-status.md"
          cat "$ARTIFACT_DIR/timing-report.json" "$ARTIFACT_DIR/endurance-report.json"
      - name: Upload video, sample frames, and reports
        uses: actions/upload-artifact@v4
        with:
          name: full-animation-test
          path: ${{ runner.temp }}/full-animation
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
